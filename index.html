<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Streaming Library</title>
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="brand" href="#/" id="brand">Library</a>
    <nav class="nav" id="nav">
      <a href="#/" data-view="home">Home</a>
      <a href="#/movies" data-view="movies">Movies</a>
      <a href="#/shows" data-view="shows">TV Shows</a>
      <a href="#/list" data-view="list">My List</a>
    </nav>
    <form class="search" id="searchForm" role="search" autocomplete="off">
      <input id="searchInput" type="search" placeholder="Search titles, genres…" aria-label="Search">
    </form>
  </header>

  <main id="main" tabindex="-1"></main>

  <!-- Title details -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
  </div>

  <!-- Player -->
  <div class="player" id="player" hidden>
    <video id="video" playsinline preload="metadata"></video>
    <div class="player-top">
      <button class="icon-btn" id="pBack" aria-label="Back">←</button>
      <div class="player-title" id="pTitle"></div>
    </div>
    <div class="player-center" id="pCenter"></div>
    <div class="player-error" id="pError" hidden></div>
    <div class="player-next" id="pNext" hidden>
      <div id="pNextText"></div>
      <div class="row">
        <button class="btn primary" id="pNextNow">Play now</button>
        <button class="btn" id="pNextCancel">Cancel</button>
      </div>
    </div>
    <div class="player-bar" id="pBar">
      <input type="range" id="pSeek" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <div class="controls">
        <button class="icon-btn" id="pPlay" aria-label="Play / pause">▶</button>
        <button class="icon-btn" id="pBack10" aria-label="Back 10 seconds">⟲10</button>
        <button class="icon-btn" id="pFwd10" aria-label="Forward 10 seconds">10⟳</button>
        <button class="icon-btn" id="pMute" aria-label="Mute">🔊</button>
        <input type="range" id="pVol" min="0" max="1" step="0.05" value="1" aria-label="Volume">
        <span class="time" id="pTime">0:00 / 0:00</span>
        <span class="spacer"></span>
        <button class="icon-btn text" id="pNextEp" hidden>Next ▶|</button>
        <div class="menu-wrap">
          <button class="icon-btn text" id="pCC" aria-label="Subtitles">CC</button>
          <div class="menu" id="ccMenu" hidden></div>
        </div>
        <div class="menu-wrap">
          <button class="icon-btn text" id="pSpeed" aria-label="Playback speed">1×</button>
          <div class="menu" id="speedMenu" hidden></div>
        </div>
        <button class="icon-btn" id="pFull" aria-label="Fullscreen">⛶</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
