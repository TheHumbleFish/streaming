<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CINEVA</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="assets/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <noscript><style>#intro{display:none}</style></noscript>
</head>
<body>
  <div id="intro" aria-hidden="true">
    <div class="intro-box">
      <img class="intro-logo" src="assets/logo.png" alt="">
      <div class="intro-word" id="introWord"></div>
      <div class="intro-line"></div>
    </div>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <div class="glow" id="glow" aria-hidden="true"></div>
  <div class="scroll-progress" id="sp" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <a class="brand" href="#/" id="brand"><img class="brand-logo" src="assets/logo.png" alt=""><span id="brandText">Cineva</span></a>
    <nav class="nav" id="nav">
      <a href="#/" data-view="home">Home</a>
      <a href="#/movies" data-view="movies">Movies</a>
      <a href="#/shows" data-view="shows">TV Shows</a>
      <a href="#/list" data-view="list">My List</a>
      <span class="nav-ink" id="navInk"></span>
    </nav>
    <form class="search" id="searchForm" role="search" autocomplete="off">
      <input id="searchInput" type="search" placeholder="Search" aria-label="Search">
    </form>
  </header>

  <main id="main" tabindex="-1"></main>

  <!-- Title details -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
  </div>

  <!-- Player -->
  <div class="player" id="player" hidden>
    <video id="video" playsinline preload="metadata"></video>
    <div class="player-top">
      <button class="icon-btn" id="pBack" aria-label="Back"></button>
      <div class="player-title" id="pTitle"></div>
    </div>
    <div class="player-center" id="pCenter"></div>
    <div class="player-error" id="pError" hidden></div>
    <div class="player-next" id="pNext" hidden>
      <div id="pNextText"></div>
      <div class="next-bar" id="pNextBar"><i></i></div>
      <div class="row">
        <button class="btn primary" id="pNextNow">Play now</button>
        <button class="btn" id="pNextCancel">Cancel</button>
      </div>
    </div>
    <div class="player-bar" id="pBar">
      <div class="seek-wrap">
        <div class="seek-tip" id="pTip">0:00</div>
        <input type="range" id="pSeek" min="0" max="1000" value="0" step="1" aria-label="Seek">
      </div>
      <div class="controls">
        <button class="icon-btn" id="pPlay" aria-label="Play / pause"></button>
        <button class="icon-btn" id="pBack10" aria-label="Back 10 seconds"></button>
        <button class="icon-btn" id="pFwd10" aria-label="Forward 10 seconds"></button>
        <button class="icon-btn" id="pMute" aria-label="Mute"></button>
        <input type="range" id="pVol" min="0" max="1" step="0.05" value="1" aria-label="Volume">
        <span class="time" id="pTime">0:00 / 0:00</span>
        <span class="spacer"></span>
        <button class="icon-btn text" id="pNextEp" hidden aria-label="Next episode"></button>
        <div class="menu-wrap">
          <button class="icon-btn text" id="pCC" aria-label="Subtitles">CC</button>
          <div class="menu" id="ccMenu" hidden></div>
        </div>
        <div class="menu-wrap">
          <button class="icon-btn text" id="pSpeed" aria-label="Playback speed">1×</button>
          <div class="menu" id="speedMenu" hidden></div>
        </div>
        <button class="icon-btn" id="pFull" aria-label="Fullscreen"></button>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toast" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
